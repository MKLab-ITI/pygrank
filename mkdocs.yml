site_name: pygrank
site_author: Emmanouil (Manios) Krasanakis
repo_url: https://github.com/MKLab-ITI/pygrank
copyright: Copyright &copy; 2024 Emmanouil Krasanakis

nav:
    - Home: 'index.md'
    - Quickstart: 'userguide/quickstart.md'
    - User Guide:
        - 'userguide/setup.md'
        - 'userguide/basics.md'
        - 'userguide/evaluation.md'
        - 'userguide/autotuning.md'
        - 'userguide/preprocessing.md'
    - Applications:
        - 'advanced/community.md'
        - 'advanced/gnn.md'
    - R&D:
        - 'tips/citations.md'
        - 'tips/big.md'
        - 'tips/license.md'
        - 'tips/contributing.md'
    - API:
        - 'generated/graph_filters.md'
        - 'generated/postprocessors.md'
        - 'generated/tuners.md'
        - 'generated/measures.md'
        - 'generated/datasets.md'

markdown_extensions:
  - admonition
  - mkautodoc
  - codehilite
  - attr_list
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.smartsymbols
  - pymdownx.inlinehilite
  - pymdownx.extra
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.gemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg

theme:
  name: mkdocs
  logo: logo.ico
  favicon: logo.ico
  color_mode: dark
  user_color_mode_toggle: True
  nav_style: dark

  features:
    - navigation.instant
    - navigation.instant.loading_indicator
    - navigation.scroll
    - content.tabs.link
    - search.suggest
    - toc.integrate
    - toc.follow
    - navigation.top
    #- navigation.footer

extra_css:
  - theme_extend.css

extra_javascript:
  - mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings


extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/maniospas
      name: Emmanouil (Manios) Krasanakis on GitHub